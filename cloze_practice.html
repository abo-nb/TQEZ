<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:#0f172a;color:#e2e8f0;display:flex;justify-content:center;padding:12px;-webkit-text-size-adjust:100%;touch-action:manipulation}
.wrap{width:100%;max-width:760px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:#94a3b8;margin-bottom:10px}
.bar b{color:#e2e8f0}

button:hover{border-color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:18px}
.sec{display:inline-block;font-size:12px;color:#7dd3fc;border:1px solid #0ea5e9;border-radius:999px;padding:2px 10px;margin-bottom:12px}
.sent{font-size:20px;line-height:1.65;margin:6px 0 18px;word-break:break-word}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;font-size:17px;min-height:56px;touch-action:manipulation}
.opt:active{transform:scale(.99)}
.opt.correct{background:#064e3b;border-color:#10b981;color:#a7f3d0}
.opt.wrong{background:#4c0519;border-color:#f43f5e;color:#fecdd3}
.opt:disabled{cursor:default;opacity:.95}
.fb{margin-top:16px;padding:14px;border-radius:12px;background:#0b1220;border:1px solid #334155;font-size:15px;line-height:1.6;display:none}
.fb b{color:#7dd3fc}
.fb .tr{color:#94a3b8}
.fb .hint{margin-top:8px;color:#fbbf24}
.row{display:flex;gap:10px;margin-top:14px;align-items:center}
.grow{flex:1}
.kbd{color:#64748b;font-size:12px}
#nextBtn{width:100%;min-height:58px;font-size:18px;font-weight:700;background:#0284c7;border-color:#0ea5e9;color:#f0f9ff}
#nextBtn:active{background:#0369a1}
.end{text-align:center;padding:30px}
.big{font-size:44px;font-weight:700;color:#7dd3fc}
.list{max-height:320px;overflow:auto;text-align:left;margin-top:16px;font-size:14px;line-height:1.7;color:#cbd5e1}
@media (hover:none){.kbd{display:none}}
@media (max-width:600px){body{padding:8px}.card{padding:14px}.sent{font-size:18px}.big{font-size:38px}}
</style>
</head>

const CHUNK = 200;
let order = [], cur = 0, answered = [], reAdd = {}, state = {done:{},wrong:{}};
const $ = (id) => document.getElementById(id);
const secKey = (s) => { const p = String(s || "").split("-"); return (Number(p[0]) || 0) * 100 + (Number(p[1]) || 0); };
function buildRange(){
  const sel = $("range"); const total = DATA.length;
  const half = Math.ceil(total / 2);
  const d1 = document.createElement("option"); d1.value = "day1"; d1.textContent = "🗓 第 1 天（1–" + half + "）"; sel.appendChild(d1);
  const d2 = document.createElement("option"); d2.value = "day2"; d2.textContent = "🗓 第 2 天（" + (half + 1) + "–" + total + "）"; sel.appendChild(d2);
  for (let s = 0; s < total; s += CHUNK) {
    const e = Math.min(s + CHUNK, total);
    const o = document.createElement("option"); o.value = s + "-" + e;
    o.textContent = "第 " + (s + 1) + "–" + e + " 題";
    sel.appendChild(o);
  }
  const rv = document.createElement("option"); rv.value = "sec:1-1:3-5"; rv.textContent = "📚 複習 1-1 ~ 3-5"; sel.appendChild(rv);
  const cu = document.createElement("option"); cu.value = "custom"; cu.textContent = "✏️ 自訂 section 範圍…"; sel.appendChild(cu);
  const cb = document.createElement("span");
  cb.id = "customBox"; cb.style.display = "none";
  cb.innerHTML = '　從 <select id="from"></select> 到 <select id="to"></select> <button id="apply">套用</button>';
  sel.parentNode.insertBefore(cb, $("restart"));
  const secs = [...new Set(DATA.map((q) => q.sec))].sort((a, b) => secKey(a) - secKey(b));
  for (const id of ["from", "to"]) {
    const box = $(id);
    secs.forEach((v) => { const o = document.createElement("option"); o.value = v; o.textContent = v; box.appendChild(o); });
  }
  $("from").value = "1-1"; $("to").value = "3-5";
  $("apply").onclick = () => start("sec:" + $("from").value + ":" + $("to").value);
}
function load(){ try { state = JSON.parse(localStorage.getItem("cloze_v1")) || {done:{},wrong:{}}; } catch(e) { state = {done:{},wrong:{}}; } }
function save(){ try { localStorage.setItem("cloze_v1", JSON.stringify(state)); } catch(e) {} }
function start(range){
  load(); reAdd = {};
  $("customBox").style.display = (range === "custom") ? "inline" : "none";
  if (range === "custom") {
    order = []; answered = []; cur = 0;
    $("card").innerHTML = '<div class="end">↑ 選擇起訖 section 後按「套用」，即可開始複習該範圍</div>';
    stats(); return;
  }
  order = DATA.map((_, i) => i);
  const total = order.length, half = Math.ceil(total / 2);
  if (range === "day1") order = order.slice(0, half);
  else if (range === "day2") order = order.slice(half);
  else if (range && range.indexOf("sec:") === 0) {
    const p = range.split(":"); const k1 = secKey(p[1]), k2 = secKey(p[2]);
    order = order.filter((i) => secKey(DATA[i].sec) >= k1 && secKey(DATA[i].sec) <= k2);
    order.sort((i, j) => secKey(DATA[i].sec) - secKey(DATA[j].sec));
  }
  else if (range && range !== "all") { const p = range.split("-").map(Number); order = order.slice(p[0], p[1]); }
  answered = []; cur = 0;
  render();
}
function stats(){
  const total = order.length;
  let right = 0; for (const r of answered) if (r) right++;
  $("prog").textContent = Math.min(cur, total) + "/" + total;
  $("acc").textContent = answered.length ? Math.round(right * 100 / answered.length) + "%" : "-";
  $("wn").textContent = Object.keys(state.wrong).length;
}
function render(){
  stats();
  const card = $("card");
  if (cur >= order.length) { return finish(card); }
  const q = DATA[order[cur]];
  card.innerHTML = '<span class="sec">' + q.sec + "</span>" +
    '<div class="sent">' + q.q.replace(/______/g, '<b style="color:#fbbf24">______</b>') + "</div>" +
    '<div id="opts"></div>' + '<div class="fb" id="fb"></div>';
  const box = $("opts");
  q.o.forEach((o, k) => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = "ABCD"[k] + ". " + o;
    b.onclick = () => choose(k);
    box.appendChild(b);
  });
  window.scrollTo(0, 0);
}
function choose(k){
  const q = DATA[order[cur]];
  const btns = [...document.querySelectorAll(".opt")];
  if (btns[0].disabled) return;
  const ok = q.o[k] === q.a;
  btns.forEach((b, i) => { b.disabled = true; if (q.o[i] === q.a) b.classList.add("correct"); });
  if (!ok) btns[k].classList.add("wrong");
  answered.push(ok);
  const id = order[cur];
  state.done[id] = 1; if (!ok) state.wrong[id] = 1; else delete state.wrong[id];
  if (!ok && !reAdd[id]) {
    reAdd[id] = 1;
    const at = Math.min(cur + 1 + 12, order.length);
    order.splice(at, 0, id);
  }
  save(); stats();
  const fb = $("fb");
  fb.style.display = "block";
  fb.innerHTML = (ok ? "✅ 答對" : "❌ 答錯（這題稍後會再出現一次）") + "　正確答案：<b>" + q.a + (q.inflected ? "（句中作 " + q.inflected + "）" : "") + "</b><br>" +
    q.pos + " " + q.zh + (q.tr ? '<div class="tr">' + q.tr + "</div>" : "") +
    (q.hint ? '<div class="hint">💡 ' + q.hint + "</div>" : "");
  try { fb.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) { fb.scrollIntoView(); }
}
function next(){ if (cur < order.length) { cur++; render(); } }
function startWrong(){
  load(); reAdd = {};
  const ids = Object.keys(state.wrong).map(Number).filter((i) => DATA[i]);
  if (!ids.length) { alert("目前沒有錯題記錄 🎉"); return; }
  order = ids; answered = []; cur = 0; render();
}
function finish(card){
  let right = 0; for (const r of answered) if (r) right++;
  const n = answered.length;
  const wrongAll = Object.keys(state.wrong).map(Number).filter((i) => DATA[i]);
  card.innerHTML = '<div class="end"><div class="big">' + (n ? Math.round(right * 100 / n) + "%" : "-") + "</div>" +
    "<div>本輪 " + right + "/" + n + " 題正確</div>" +
    (wrongAll.length ? '<div style="margin-top:14px">累積錯題 <b>' + wrongAll.length + "</b> 題（建議立刻再刷一輪）</div>" : "") +
    '<div class="row" style="justify-content:center"><button id="again">只練錯題</button><button id="againAll">再來一輪</button></div>' +
    '<div class="list" id="wl"></div></div>';
  const wl = $("wl");
  wrongAll.slice(0, 300).forEach((i) => { const q = DATA[i]; const d = document.createElement("div"); d.textContent = "• " + q.a + " — " + q.zh; wl.appendChild(d); });
  $("again").onclick = () => startWrong();
  $("againAll").onclick = () => start($("range").value);
}
document.addEventListener("keydown", (e) => {
  if (e.key >= "1" && e.key <= "4") choose(Number(e.key) - 1);
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); next(); }
});
$("range").onchange = (e) => start(e.target.value);
$("restart").onclick = () => start($("range").value);
$("nextBtn").onclick = () => next();
buildRange();
start("all");
</script>
</body>
</html>
